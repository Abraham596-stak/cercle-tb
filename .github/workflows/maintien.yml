# GitHub met en pause les tâches planifiées d'un dépôt inactif depuis 60 jours.
# Ce petit envoi mensuel garde les rappels et la discipline actifs.
name: Maintien
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  garder-actif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d" > .derniere-activite
          git config user.name "cercle-tb"
          git config user.email "cercle-tb@users.noreply.github.com"
          git add .derniere-activite
          git commit -m "Maintien de l'activité" || exit 0
          git push
