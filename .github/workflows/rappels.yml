# Rappels automatiques du Cercle TB (heures en UTC ; heure locale = UTC + 1)
#   Dimanche 8h00   → bilan de la semaine
#   Dimanche 15h00  → objectif de la semaine
#   Lundi→samedi 23h30 → bilan du jour
name: Rappels

on:
  schedule:
    - cron: "0 7 * * 0"
    - cron: "0 14 * * 0"
    - cron: "30 22 * * 1-6"
  workflow_dispatch:
    inputs:
      type:
        description: "Rappel à envoyer pour tester"
        required: true
        default: "jour"
        type: choice
        options: [jour, semaine, objectif]

jobs:
  envoyer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rappels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Choisir le rappel
        id: choix
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 * * 0")     echo "type=semaine" >> "$GITHUB_OUTPUT" ;;
            "0 14 * * 0")    echo "type=objectif" >> "$GITHUB_OUTPUT" ;;
            "30 22 * * 1-6") echo "type=jour" >> "$GITHUB_OUTPUT" ;;
            *)               echo "type=${{ inputs.type }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: node envoyer.mjs ${{ steps.choix.outputs.type }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
