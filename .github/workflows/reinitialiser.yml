# Supprime un compte précis (lancement manuel uniquement)
name: Supprimer un compte
on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail du compte à supprimer"
        required: true
jobs:
  supprimer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rappels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node reinitialiser.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAIL: ${{ inputs.email }}
