# Remise à zéro complète (lancement manuel uniquement)
name: Remise a zero
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écris EFFACER pour tout supprimer"
        required: true
jobs:
  effacer:
    if: ${{ inputs.confirmation == 'EFFACER' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rappels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node reinitialiser.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
