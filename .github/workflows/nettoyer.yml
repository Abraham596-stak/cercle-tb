name: Retirer ancien site
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 hosting:sites:delete mon-argent-app --project cercle-tb --force --non-interactive && echo "::notice::SUPPRIME"
