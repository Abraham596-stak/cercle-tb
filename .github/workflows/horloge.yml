# Lancé toutes les 5 minutes par cron-job.org (plus fiable que l'horloge de GitHub).
# Prévient l'admin des demandes, envoie les bienvenues, les blocages et les rappels à l'heure.
name: Horloge
on:
  workflow_dispatch:
concurrency:
  group: horloge
  cancel-in-progress: false
jobs:
  tic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rappels
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rappels/package.json
      - run: npm install --no-audit --no-fund
      - name: Discipline, envois et assistante
        run: |
          set -o pipefail
          for f in "discipline.mjs" "envoyer.mjs auto" "assistante.mjs"; do
            echo "=== $f"
            node $f 2>&1 | tee ../etape.log || { echo "::error::$f : $(grep -v '^\s*$' ../etape.log | grep -i 'error\|code:\|details\|quota\|exhausted\|permission' | head -6 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          done
